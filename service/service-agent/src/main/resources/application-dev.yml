spring:
  ai:
    dashscope:
      api-key: sk-192fce70d09b4f94bb5373c9c5287fe7
      chat:
        options:
          model: qwen3.6-max-preview
  # 数据库连接（从业务库同步数据到RAG知识库）
  datasource:
    url: jdbc:mysql://localhost:3306/tingshu?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
